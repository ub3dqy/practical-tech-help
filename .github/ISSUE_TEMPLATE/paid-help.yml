name: Paid help request
description: Request an AI agent, a small tool or a software fix.
title: "[Paid help] "
body:
  - type: markdown
    attributes:
      value: |
        Describe the task below. We agree on the scope, fee, deadline and payment method before work starts.

        Payment is in USDC. We agree on the transfer network before payment.

        This request is public. Do not include passwords, access tokens or private files.

        Dima Mak / ub3dqy
  - type: textarea
    id: problem
    attributes:
      label: What needs fixing or building?
      description: Describe the result you need. For an AI agent, say what should start it and what it should do. For a bug, say what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: project
    attributes:
      label: Project and environment
      description: Link the repository if available. List the tools or data the agent would use, or the software versions and operating system for a bug.
  - type: textarea
    id: example
    attributes:
      label: Small example or steps to reproduce
      description: Share a public example with sensitive details removed. For a bug, mention what you have tried. For an agent, mention which actions need your approval.
  - type: input
    id: budget
    attributes:
      label: Budget (USDC)
      description: Give an amount in USDC or write "Please quote" if you need an estimate.
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: Desired deadline
      description: Include the date and time zone, or leave blank if flexible.
